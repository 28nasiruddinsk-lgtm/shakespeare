---
# cPanel > Git Version Control > Deploy HEAD Commit copies the repo into the domain folder (document root).
# No --delete: files that are not in git (mail-config.php, storage/*.csv) stay on the server.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/shakespearepublishingshouse.com/
    - /usr/bin/rsync -a --exclude=.git --exclude=.cpanel.yml --exclude=.gitignore ./ $DEPLOYPATH
